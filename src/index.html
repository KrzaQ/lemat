<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lemat</title>
    <link rel="stylesheet" href="vendor/katex/katex.min.css" />
    <link rel="stylesheet" href="board.css" />
    <script src="vendor/marked.min.js"></script>
    <script src="vendor/katex/katex.min.js"></script>
    <script src="vendor/katex/auto-render.min.js"></script>
    <script type="module" src="board.js"></script>
    <script type="module" src="chat.js"></script>
  </head>
  <body>
    <section id="board-pane">
      <p id="note" role="status" hidden></p>
      <main id="board"></main>
    </section>
    <aside id="chat">
      <div id="messages" aria-live="polite"></div>
      <div id="question" role="alertdialog" aria-live="assertive" hidden>
        <p class="title"></p>
        <p class="text"></p>
        <pre class="detail"></pre>
        <ol class="options"></ol>
        <div class="answers">
          <span class="hint"></span>
          <button type="button" class="no">Nie (Esc)</button>
          <button type="button" class="yes">Tak (Enter)</button>
        </div>
      </div>
      <div id="composer">
        <textarea id="input" rows="3" aria-label="Wiadomość do agenta"></textarea>
        <div class="buttons">
          <div class="engine" title="Silnik i model, które odpowiedzą na następną wiadomość">
            <select id="engine" aria-label="Silnik">
              <option value="claude">Claude</option>
              <option value="pi">pi</option>
            </select>
            <input id="model" list="models" aria-label="Model" spellcheck="false" />
            <datalist id="models"></datalist>
          </div>
          <button type="button" id="send">Wyślij</button>
          <button type="button" id="stop" hidden>Zatrzymaj</button>
        </div>
      </div>
    </aside>
  </body>
</html>
